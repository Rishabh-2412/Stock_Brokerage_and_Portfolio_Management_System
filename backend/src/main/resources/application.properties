# ==========================================
# Application
# ==========================================
spring.application.name=stock-brokerage-backend

# ==========================================
# PostgreSQL Database Configuration
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/stock_brokerage_db
spring.datasource.username=postgres
spring.datasource.password=Rishabh2006.
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ==========================================
# Flyway Configuration
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==========================================
# Jackson Configuration
# ==========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# ==========================================
# JWT Configuration
# ==========================================
app.jwt.secret=MyVeryLongSecretKeyForJwtAuthenticationThatIsMoreThanSixtyFourCharactersLong1234567890
app.jwt.expiration=86400000
app.jwt.refresh.expiration=604800000

# ==========================================
# Server Configuration
# ==========================================
server.port=8080
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# ==========================================
# Logging Configuration
# ==========================================
logging.level.root=INFO
logging.level.com.example.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==========================================
# Actuator Configuration
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ==========================
# SpringDoc / Swagger
# ==========================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/v3/api-docs